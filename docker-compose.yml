services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lucena_finance
      POSTGRES_USER: lucena_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-15433}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./services/api
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/lucena_finance
      DATABASE_USER: lucena_app
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      FIREBASE_PROJECT_ID: lucenas1010
      PROFILE_ENCRYPTION_KEY: ${PROFILE_ENCRYPTION_KEY:-local-development-only-change-me}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/v3}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:4200}
    env_file:
      - path: ./.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  insights:
    build: ./services/insights
    expose: ["8000"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
